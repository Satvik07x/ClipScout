# Render Blueprint: the Python API (FastAPI). The React app goes on Vercel (see README, "Deploy").
services:
  - type: web
    name: clipscout-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/config
    envVars:
      - key: CLIPSCOUT_PUBLIC          # visitors get their own library + the usage limits
        value: "1"
      - key: CLIPSCOUT_CORS_ORIGINS    # your Vercel address, e.g. https://clipscout.vercel.app (no trailing slash)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
